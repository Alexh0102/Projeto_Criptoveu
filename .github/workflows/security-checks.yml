name: CI Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test security and compatibility
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Audita apenas dependências de produção (o que é empacotado no app/site).
      # Ferramentas de build (ex.: cadeia do Tailwind 3) não bloqueiam o PR;
      # continuam monitoradas pelo Dependabot / Dependency Review.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
